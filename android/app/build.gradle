plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jwquiz.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.jwquiz.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Align transitive kotlin-stdlib-jdk7/8 (1.6.21) with stdlib 1.8.22 from appcompat 1.7.0
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7') {
            version { require '1.8.22' }
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8') {
            version { require '1.8.22' }
        }
    }
}
